# Shok Taxi — Nginx Production Config

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name shoktaxi.uz www.shoktaxi.uz;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name shoktaxi.uz www.shoktaxi.uz;

    # SSL (Certbot avtomatik to'ldiradi)
    ssl_certificate /etc/letsencrypt/live/shoktaxi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shoktaxi.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend static fayllar
    root /home/deploy/shoktaxi/frontend/dist;
    index index.html;

    # Gzip siqish
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # API — backend proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Frontend SPA — barcha yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker — cache qilmaslik
    location /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # manifest.json
    location /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
